name: Build Custom Twoyi (ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "22.1.7171670"
      # Replace <YOUR_TAG> with the tag you used when publishing your GitHub Release (e.g., v1.0-assets)
      ROOTFS_URL: "https://github.com/falconarcher469-blip/twoyi/releases/download/<YOUR_TAG>/rootfs.7z"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK r22b
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"

      - name: Export NDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Install Rust & aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-xdk
        run: cargo install cargo-xdk

      - name: Download rootfs.7z from GitHub Release
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/rootfs.7z "$ROOTFS_URL"
          ls -lh app/src/main/assets/rootfs.7z

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Rust & C++ native libraries (arm64-v8a)
        run: ./gradlew cargoBuild

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Custom Twoyi APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Twoyi-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          
